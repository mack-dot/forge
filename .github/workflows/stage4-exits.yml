name: Stage 4 real PR exit checks
"on":
  push:
    branches: [main]
    paths: [results/stage4/pr-runs.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read
jobs:
  exits:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.11'
          check-latest: false
      - name: Check affected claims in the actual PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/exit_stage_4.py --case affected-claims
      - name: Check both real unapproved spec PRs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/exit_stage_4.py --case unapproved-spec
      - name: Check the approved fee spec PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/exit_stage_4.py --case approved-spec
      - name: Save actual EXIT results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4-exit-results
          path: build/stage4-exits/
          if-no-files-found: error
