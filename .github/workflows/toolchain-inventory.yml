name: Stage 4 Linux toolchain inventory

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/toolchain-inventory.yml
      - toolchain/ci-bootstrap.json
      - toolchain/inventory_ci.py

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    steps:
      - name: Read the trusted pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.11'
          check-latest: false
      - name: Select the pinned installer
        run: |
          python -m venv .toolchain/ci-python
          .toolchain/ci-python/bin/python -m pip install --disable-pip-version-check pip==25.3
      - name: Inventory and exercise the real toolchain
        run: .toolchain/ci-python/bin/python toolchain/inventory_ci.py
      - name: Save the inventory for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4-linux-toolchain-inventory
          path: build/ci-inventory/inventory.json
          if-no-files-found: error
