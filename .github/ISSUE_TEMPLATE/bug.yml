name: Bug or wrong result
description: A command, check or document that does not do what it says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Exact command, commit, real exit code and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and architecture, Python, Node and Dafny versions.
