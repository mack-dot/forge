name: Idea or new component
description: A new proof-carrying component, backend or tool improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What evidence would show it works
      description: Which checker, which claims, which method (source_proof, tested_against_proved_model, ...).
