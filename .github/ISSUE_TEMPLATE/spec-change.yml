name: Propose a spec, policy or gate change
description: Protected files change only after exact human approval.
labels: [proposal]
body:
  - type: textarea
    id: reason
    attributes:
      label: Plain-English reason
      description: What behavior should change, and why. No code needed yet.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected files and claims
      description: Which spec, policy or gate files and which claims (for example C1–C5).
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I understand the change needs an exact diff in proposals/ and the owner's approval of its exact bytes before anything is applied.
          required: true
