name: Forge Stage 9 private dry run v3.2 (no signing)

# Non-signing integration test of the unapplied v3.2 candidate. No OIDC token
# permission, no secrets, no signing service, no release, no production workflow.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'mack-dot/forge'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FORGE_STAGE9_IMPLEMENTATION: be23ec85ec2d9652bd1c87f6870c0d7130862af169319af24975b941ac3b5f57
      FORGE_STAGE9_REQUEST: '{"expected_source_commit": "${{ github.sha }}"}'
    steps:
      - name: Prove that this job cannot request an OIDC token
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Checkout exact dispatched main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the candidate to a copy of the checkout
        run: |
          C="$RUNNER_TEMP/candidate-root"
          cp -a "$GITHUB_WORKSPACE" "$C" && cd "$C"
          git apply --check proposals/provenance-hosted-v32/proposed.diff
          git apply proposals/provenance-hosted-v32/proposed.diff
      - name: Python 3.10.11 from a hash-checked archive
        run: |
          P="$RUNNER_TEMP/forge-python"
          A="$RUNNER_TEMP/python-3.10.11.tar.gz"
          curl -fsSL -o "$A" https://github.com/actions/python-versions/releases/download/3.10.11-11114431484/python-3.10.11-linux-24.04-x64.tar.gz
          echo "3d10b78a944ee1cf236bf09f3913d0db359d3e80954dbda6d55f447b34099bae  $A" | sha256sum -c
          mkdir -p "$P" && tar -xzf "$A" -C "$P"
          LD_LIBRARY_PATH="$P/lib" "$P/bin/python3" -m ensurepip --default-pip
          echo "$P/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$P/lib" >> "$GITHUB_ENV"
      - name: Authenticate the checkout before any repository code
        working-directory: ${{ runner.temp }}/candidate-root
        run: |
          python3 -I -S -B -c 'import hashlib, json, sys
          lock = open("gate/provenance/implementation.lock", "rb").read()
          if hashlib.sha256(lock).hexdigest() != sys.argv[1]: sys.exit("IMPLEMENTATION_LOCK")
          boot = open("gate/provenance/bootstrap.py", "rb").read()
          if hashlib.sha256(boot).hexdigest() != json.loads(lock)["files"]["gate/provenance/bootstrap.py"]: sys.exit("BOOTSTRAP_BYTES")' "$FORGE_STAGE9_IMPLEMENTATION"
          python3 -I -S -B gate/provenance/bootstrap.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION" --check
      - name: Record and reclaim disk on the disposable runner
        run: |
          df -B1 / && nproc && free -b
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          docker image prune --all --force
          df -B1 /
      - name: Candidate hosted_setup.py through the bootstrap
        working-directory: ${{ runner.temp }}/candidate-root
        env:
          FORGE_STAGE7_ROOT: ${{ runner.temp }}/seed
        run: python3 -I -S -B gate/provenance/bootstrap.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION" -- gate/provenance/hosted_setup.py
      - name: Candidate preflight.py through the bootstrap
        working-directory: ${{ runner.temp }}/candidate-root
        env:
          FORGE_STAGE7_ROOT: ${{ runner.temp }}/seed
        run: python3 -I -S -B gate/provenance/bootstrap.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION" -- gate/provenance/preflight.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION"
      - name: Candidate package() and replay() after a fresh bootstrap check
        working-directory: ${{ runner.temp }}/candidate-root
        env:
          FORGE_STAGE7_ROOT: ${{ runner.temp }}/seed
        run: |
          python3 -I -S -B gate/provenance/bootstrap.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION" --check
          python3 -E -s -B -X pycache_prefix="$RUNNER_TEMP/pycache" proposals/provenance-hosted/dry_run.py --implementation-sha256 "$FORGE_STAGE9_IMPLEMENTATION" --expected-package proposals/provenance-hosted-v2/controller-descriptor.json --output results/stage9/dry-run
      - name: Collect records
        if: always()
        run: |
          mkdir -p probe
          cp -R "$RUNNER_TEMP/candidate-root/results/stage9/producer-output" probe/ || true
          cp -R "$RUNNER_TEMP/candidate-root/results/stage9/dry-run" probe/ || true
      - name: Preserve records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-stage9-private-dry-run-v32-${{ github.run_id }}
          path: probe/
          include-hidden-files: true
          if-no-files-found: error
